[project]
name = "bid-copilot"
version = "0.1.0"
description = "Bid Qualification Copilot: permission-aware retrieval, bounded tool calling and human-approved writes (portfolio prototype, synthetic data)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=3.0",
    "azure-identity>=1.19",
    "azure-data-tables>=12.6",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
